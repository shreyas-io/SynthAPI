_format_version: "3.0"
_transform: true

services:
  - name: mock-stack-backend
    url: http://web-apps:3001
    routes:
      - name: api-control-plane
        paths:
          - /mock-stack
        strip_path: true
        preserve_host: true

      - name: public-mock-apis
        hosts:
          - "*.mock-stack.localhost"
        paths:
          - /
        strip_path: false
        preserve_host: true
        plugins:
          - name: pre-function
            config:
              access:
                - |
                  local host = kong.request.get_host()
                  local slug = string.match(host, "^([^.]+)%.mock%-stack%.localhost$")

                  if slug then
                    kong.service.request.set_header("x-project-slug", slug)
                  end
