services:
  api:
    build:
      context: .
      dockerfile: web-apps/apps/api/Dockerfile.local
    container_name: synthapi-api
    command: >
      sh -lc "
        CI=true pnpm install --frozen-lockfile --force --store-dir /tmp/pnpm-store --filter @synthapi/api... &&
        pnpm --filter @synthapi/api run migrate:latest &&
        pnpm --filter @synthapi/api run dev
      "
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - web-apps/apps/api/.env
    expose:
      - "3001"
    ports:
      - "3001:3001"
      - "9229:9229"
    volumes:
      - .:/repo
      - api-root-node-modules:/repo/web-apps/node_modules
      - api-node-modules:/repo/web-apps/apps/api/node_modules
      - web-node-modules:/repo/web-apps/apps/web/node_modules

  web:
    build:
      context: .
      dockerfile: web-apps/apps/web/Dockerfile.local
    container_name: synthapi-web
    command: >
      sh -lc "
        CI=true pnpm install --frozen-lockfile --force --store-dir /tmp/pnpm-store --filter @synthapi/web... --prod &&
        pnpm --filter @synthapi/web run dev
      "
    depends_on:
      api:
        condition: service_started
    env_file:
      - web-apps/apps/web/.env
    ports:
      - "5173:5173"
    volumes:
      - .:/repo
      - web-root-node-modules:/repo/web-apps/node_modules
      - api-node-modules:/repo/web-apps/apps/api/node_modules
      - web-node-modules:/repo/web-apps/apps/web/node_modules

  landing:
    build:
      context: .
      dockerfile: web-apps/apps/landing/Dockerfile.local
    container_name: synthapi-landing
    command: >
      sh -lc "
        CI=true pnpm install --frozen-lockfile --force --store-dir /tmp/pnpm-store --filter @synthapi/landing... &&
        pnpm --filter @synthapi/landing run dev
      "
    environment:
      VITE_PLATFORM_BASE_URL: /platform
    ports:
      - "5174:5174"
    volumes:
      - .:/repo
      - landing-root-node-modules:/repo/web-apps/node_modules
      - landing-node-modules:/repo/web-apps/apps/landing/node_modules

  gateway:
    image: nginx:1.27-alpine
    container_name: synthapi-gateway
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
      landing:
        condition: service_started
    ports:
      - "8787:80"
    volumes:
      - ./gateway/nginx/synthapi.conf:/etc/nginx/conf.d/default.conf:ro
  postgres:
    image: postgres:17-alpine
    container_name: synthapi-postgres
    environment:
      POSTGRES_DB: mock_api
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      DB_NAME: mock_api
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4-alpine
    container_name: synthapi-redis
    command: ["redis-server", "--requirepass", "redis-password"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis-password", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: synthapi-redis-commander
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOSTS: "local:redis:6379:0:redis-password"
    ports:
      - "8081:8081"

volumes:
  api-root-node-modules:
  web-root-node-modules:
  landing-root-node-modules:
  api-node-modules:
  web-node-modules:
  landing-node-modules:
  postgres-data:
  redis-data:
