services:
  api:
    build:
      context: .
      dockerfile: web-apps/apps/api/Dockerfile.local
    container_name: mock-stack-api
    command: >
      sh -lc "
        CI=true pnpm install --frozen-lockfile &&
        pnpm --filter @mock-stack/agent-orchestration-engine run build &&
        pnpm --filter @mock-stack/mockapi-engine run build &&
        pnpm --filter @mock-stack/api run migrate:latest &&
        pnpm --filter @mock-stack/api run seed:local &&
        pnpm --filter @mock-stack/agent-orchestration-engine run migrate:latest &&
        pnpm --filter @mock-stack/agent-orchestration-engine run seed:local &&
        pnpm --filter @mock-stack/api run dev
      "
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - web-apps/apps/api/.env
    expose:
      - "3001"
    ports:
      - "3001:3001"
      - "9229:9229"
    volumes:
      - .:/repo
      - node-modules:/repo/web-apps/node_modules
      - api-node-modules:/repo/web-apps/apps/api/node_modules
      - web-node-modules:/repo/web-apps/apps/web/node_modules
      - mockapi-engine-node-modules:/repo/web-apps/packages/mockapi-engine/node_modules
      - agent-orchestration-engine-node-modules:/repo/web-apps/packages/agent-orchestration-engine/node_modules

  web:
    build:
      context: .
      dockerfile: web-apps/apps/web/Dockerfile.local
    container_name: mock-stack-web
    command: >
      sh -lc "
        CI=true pnpm install --frozen-lockfile &&
        pnpm --filter @mock-stack/web run dev
      "
    depends_on:
      api:
        condition: service_started
    env_file:
      - web-apps/apps/web/.env
    ports:
      - "5173:5173"
    volumes:
      - .:/repo
      - node-modules:/repo/web-apps/node_modules
      - api-node-modules:/repo/web-apps/apps/api/node_modules
      - web-node-modules:/repo/web-apps/apps/web/node_modules
      - mockapi-engine-node-modules:/repo/web-apps/packages/mockapi-engine/node_modules
      - agent-orchestration-engine-node-modules:/repo/web-apps/packages/agent-orchestration-engine/node_modules

  gateway:
    image: kong:3.9
    container_name: mock-stack-gateway
    depends_on:
      - api
      - web
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "off"
    ports:
      - "8787:8000"
    volumes:
      - ./gateway/kong.yml:/kong/declarative/kong.yml:ro
  postgres:
    image: postgres:17-alpine
    container_name: mock-stack-postgres
    environment:
      POSTGRES_DB: mock_api
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      DB_NAME: mock_api
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4-alpine
    container_name: mock-stack-redis
    command: ["redis-server", "--requirepass", "redis-password"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis-password", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: mock-stack-redis-commander
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOSTS: "local:redis:6379:0:redis-password"
    ports:
      - "8081:8081"

volumes:
  node-modules:
  api-node-modules:
  web-node-modules:
  mockapi-engine-node-modules:
  agent-orchestration-engine-node-modules:
  postgres-data:
  redis-data:
