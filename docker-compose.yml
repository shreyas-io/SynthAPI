services:
  web-apps:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: mock-stack-web-apps
    command: >
      sh -lc "
        CI=true pnpm install --frozen-lockfile &&
        pnpm --filter @mock-stack/api run migrate:latest &&
        pnpm --filter @mock-stack/mockapi-engine run migrate:latest &&
        pnpm dev:local
      "
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      PORT: "${API_PORT:-3001}"
      HOST: "0.0.0.0"
      CORS_WHITELISTED_DOMAINS: "${CORS_WHITELISTED_DOMAINS:-http://localhost:5173,http://127.0.0.1:5173}"
      VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8787/mock-stack}"
      APPLICATION_DB_USER: "${POSTGRES_USER:-user}"
      APPLICATION_DB_PASS: "${POSTGRES_PASSWORD:-password}"
      APPLICATION_DB_HOST: postgres
      APPLICATION_DB_PORT: "5432"
      APPLICATION_DB_NAME: "${APPLICATION_DB_NAME:-mock_api_app}"
      DB_USER: "${POSTGRES_USER:-user}"
      DB_PASS: "${POSTGRES_PASSWORD:-password}"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: "${APPLICATION_DB_NAME:-mock_api_app}"
      API_GATEWAY_DB_USER: "${POSTGRES_USER:-user}"
      API_GATEWAY_DB_PASS: "${POSTGRES_PASSWORD:-password}"
      API_GATEWAY_DB_HOST: postgres
      API_GATEWAY_DB_PORT: "5432"
      API_GATEWAY_DB_NAME: "${API_GATEWAY_DB_NAME:-api_gateway}"
      AGENT_ORCHESTRATION_DB_USER: "${POSTGRES_USER:-user}"
      AGENT_ORCHESTRATION_DB_PASS: "${POSTGRES_PASSWORD:-password}"
      AGENT_ORCHESTRATION_DB_HOST: postgres
      AGENT_ORCHESTRATION_DB_PORT: "5432"
      AGENT_ORCHESTRATION_DB_NAME: "${AGENT_ORCHESTRATION_DB_NAME:-agent_orchestration}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASS: "${REDIS_PASSWORD:-redis-password}"
    expose:
      - "3001"
    ports:
      - "5173:5173"
      - "9229:9229"
    volumes:
      - .:/repo
      - node-modules:/repo/web-apps/node_modules
      - api-node-modules:/repo/web-apps/apps/api/node_modules
      - web-node-modules:/repo/web-apps/apps/web/node_modules
      - mockapi-engine-node-modules:/repo/web-apps/packages/mockapi-engine/node_modules
      - agent-orchestration-engine-node-modules:/repo/web-apps/packages/agent-orchestration-engine/node_modules

  gateway:
    image: kong:3.9
    container_name: mock-stack-gateway
    depends_on:
      - web-apps
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "off"
    ports:
      - "8787:8000"
    volumes:
      - ./gateway/kong.yml:/kong/declarative/kong.yml:ro

  postgres:
    image: postgres:17-alpine
    container_name: mock-stack-postgres
    environment:
      POSTGRES_DB: "${APPLICATION_DB_NAME:-mock_api_app}"
      POSTGRES_USER: "${POSTGRES_USER:-user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-password}"
      APPLICATION_DB_NAME: "${APPLICATION_DB_NAME:-mock_api_app}"
      API_GATEWAY_DB_NAME: "${API_GATEWAY_DB_NAME:-api_gateway}"
      AGENT_ORCHESTRATION_DB_NAME: "${AGENT_ORCHESTRATION_DB_NAME:-agent_orchestration}"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/001-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-init:
    image: postgres:17-alpine
    container_name: mock-stack-postgres-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: "${POSTGRES_USER:-user}"
      PGPASSWORD: "${POSTGRES_PASSWORD:-password}"
      APPLICATION_DB_NAME: "${APPLICATION_DB_NAME:-mock_api_app}"
      API_GATEWAY_DB_NAME: "${API_GATEWAY_DB_NAME:-api_gateway}"
      AGENT_ORCHESTRATION_DB_NAME: "${AGENT_ORCHESTRATION_DB_NAME:-agent_orchestration}"
    volumes:
      - ./docker/postgres/init-databases.sh:/init-databases.sh:ro
    command: ["sh", "/init-databases.sh"]

  redis:
    image: redis:7.4-alpine
    container_name: mock-stack-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis-password}"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis-password}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: mock-stack-redis-commander
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOSTS: "local:redis:6379:0:${REDIS_PASSWORD:-redis-password}"
    ports:
      - "8081:8081"

volumes:
  node-modules:
  api-node-modules:
  web-node-modules:
  mockapi-engine-node-modules:
  agent-orchestration-engine-node-modules:
  postgres-data:
  redis-data:
