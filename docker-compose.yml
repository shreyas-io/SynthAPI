services:
  api:
    build:
      context: .
      dockerfile: web-apps/apps/api/Dockerfile.local
    container_name: synthapi-api
    command: >
      sh -lc "
        pnpm install --frozen-lockfile --force --store-dir /tmp/pnpm-store --filter @synthapi/api... &&
        pnpm --filter @synthapi/api run migrate:latest &&
        pnpm --filter @synthapi/api run dev
      "
    depends_on:
      postgres:
        condition: service_healthy
      python-runner-lambda:
        condition: service_started
    env_file:
      - web-apps/apps/api/.env
    environment:
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: "postgresql://user:password@postgres:5432/mock_api"
      PYTHON_RUNNER_LAMBDA_ENDPOINT: "http://python-runner-lambda:8080"
      AWS_ACCESS_KEY_ID: "dummy"
      AWS_SECRET_ACCESS_KEY: "dummy"
      AWS_REGION: "us-east-1"
      PYTHON_RUNNER_LAMBDA_FUNCTION_NAME: "synthapi-python-runner"
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      SENTRY_DSN: ""
    dns:
      - 8.8.8.8
      - 127.0.0.11
    ports:
      - "8787:8787"
      - "9229:9229"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:8787/health'').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s
    volumes:
      - .:/repo
      - root-node-modules:/repo/web-apps/node_modules
      - api-node-modules:/repo/web-apps/apps/api/node_modules
      - web-node-modules:/repo/web-apps/apps/web/node_modules

  web:
    build:
      context: .
      dockerfile: web-apps/apps/web/Dockerfile.local
    container_name: synthapi-web
    command: >
      sh -lc "
        CI=true pnpm install --frozen-lockfile --force --store-dir /tmp/pnpm-store --filter @synthapi/web... &&
        pnpm --filter @synthapi/web run dev
      "
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - web-apps/apps/web/.env
    ports:
      - "5173:5173"
    volumes:
      - .:/repo
      - root-node-modules:/repo/web-apps/node_modules
      - api-node-modules:/repo/web-apps/apps/api/node_modules
      - web-node-modules:/repo/web-apps/apps/web/node_modules

  landing:
    build:
      context: .
      dockerfile: web-apps/apps/landing/Dockerfile.local
    container_name: synthapi-landing
    command: >
      sh -lc "
        CI=true pnpm install --frozen-lockfile --force --store-dir /tmp/pnpm-store --filter @synthapi/landing... &&
        pnpm --filter @synthapi/landing run dev
      "
    environment:
      VITE_PLATFORM_BASE_URL: http://localhost:5173
    ports:
      - "5174:5174"
    depends_on:
      web:
        condition: service_started
    volumes:
      - .:/repo
      - root-node-modules:/repo/web-apps/node_modules
      - landing-node-modules:/repo/web-apps/apps/landing/node_modules

  python-runner-lambda:
    build:
      context: ./lambdas/python-runner
    container_name: synthapi-python-runner-lambda
    ports:
      - "9001:8080"
    environment:
      AWS_LAMBDA_FUNCTION_NAME: synthapi-python-runner

  postgres:
    image: postgres:17-alpine
    container_name: synthapi-postgres
    environment:
      POSTGRES_DB: mock_api
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      DB_NAME: mock_api
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  root-node-modules:
  api-node-modules:
  web-node-modules:
  landing-node-modules:
  postgres-data:
  python-runner-lambda-node-modules:
