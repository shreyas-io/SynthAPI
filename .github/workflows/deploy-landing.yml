name: Deploy Landing

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-landing.yml"
      - "web-apps/package.json"
      - "web-apps/pnpm-lock.yaml"
      - "web-apps/pnpm-workspace.yaml"
      - "web-apps/apps/landing/**"

jobs:
  deploy:
    name: Deploy Landing to Cloudflare Pages
    runs-on: ubuntu-latest

    permissions:
      contents: read
      deployments: write

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_LANDING_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_LANDING_PAGES_PROJECT_NAME }}
      VITE_PLATFORM_BASE_URL: ${{ vars.VITE_PLATFORM_BASE_URL }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: pnpm
          cache-dependency-path: web-apps/pnpm-lock.yaml

      - name: Validate deploy config
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_LANDING_PAGES_PROJECT_NAME"
          test -n "$VITE_PLATFORM_BASE_URL"
          test -n "$VITE_API_BASE_URL"

      - name: Install dependencies
        working-directory: web-apps
        run: pnpm install --frozen-lockfile

      - name: Typecheck landing app
        working-directory: web-apps
        run: pnpm --filter @synthapi/landing run typecheck

      - name: Build landing app
        working-directory: web-apps
        run: pnpm --filter @synthapi/landing run build

      - name: Deploy to Pages
        working-directory: web-apps
        run: pnpm --filter @synthapi/landing run deploy:pages
