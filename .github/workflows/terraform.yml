name: Terraform

on:
  workflow_dispatch:
    inputs:
      stack:
        description: "Terraform stack to run"
        required: true
        default: "prod"
        type: choice
        options:
          - bootstrap
          - prod
      action:
        description: "Terraform action"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
  push:
    branches:
      - main
    paths:
      - ".github/workflows/terraform.yml"
      - "terraform/**"

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform fmt -check -recursive terraform

      - name: Validate bootstrap
        run: |
          terraform -chdir=terraform/bootstrap init -backend=false
          terraform -chdir=terraform/bootstrap validate

      - name: Validate prod
        run: |
          terraform -chdir=terraform/envs/prod init -backend=false
          terraform -chdir=terraform/envs/prod validate

  run:
    name: Terraform ${{ inputs.action }} (${{ inputs.stack }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: validate

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
      TF_VAR_AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_GITHUB_REPOSITORY: ${{ github.repository }}
      TF_VAR_TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_TF_STATE_LOCK_TABLE: ${{ vars.TF_STATE_LOCK_TABLE }}
      TF_VAR_DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
      TF_VAR_PLATFORM_PAGES_CNAME_TARGET: ${{ vars.PLATFORM_PAGES_CNAME_TARGET }}
      TF_VAR_ACME_EMAIL: ${{ vars.ACME_EMAIL }}
      TF_VAR_BOOTSTRAP_SECRET_ARN: ${{ vars.BOOTSTRAP_SECRET_ARN }}
      TF_VAR_DB_PASSWORD: ${{ secrets.TF_VAR_DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate workflow config
        run: |
          test -n "$AWS_REGION"
          test -n "$AWS_ROLE_ARN"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init selected stack
        run: |
          if [ "${{ inputs.stack }}" = "bootstrap" ]; then
            terraform -chdir=terraform/bootstrap init
          else
            test -n "$TF_VAR_DOMAIN_NAME"
            test -n "$TF_VAR_ACME_EMAIL"
            test -n "$TF_VAR_BOOTSTRAP_SECRET_ARN"
            test -n "$TF_VAR_DB_PASSWORD"
            test -n "$TF_VAR_TF_STATE_BUCKET"
            test -n "$TF_VAR_TF_STATE_LOCK_TABLE"

            terraform -chdir=terraform/envs/prod init \
              -backend-config="bucket=$TF_VAR_TF_STATE_BUCKET" \
              -backend-config="key=prod/terraform.tfstate" \
              -backend-config="region=$AWS_REGION" \
              -backend-config="dynamodb_table=$TF_VAR_TF_STATE_LOCK_TABLE"
          fi

      - name: Terraform plan/apply
        run: |
          if [ "${{ inputs.stack }}" = "bootstrap" ]; then
            STACK_DIR="terraform/bootstrap"
          else
            STACK_DIR="terraform/envs/prod"
          fi

          if [ "${{ inputs.action }}" = "apply" ]; then
            terraform -chdir="$STACK_DIR" apply -auto-approve
          else
            terraform -chdir="$STACK_DIR" plan
          fi
