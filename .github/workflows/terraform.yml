name: Terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy
      confirm_destroy:
        description: "Required for destroy. Set true only after confirming prod can be deleted."
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - ".github/workflows/terraform.yml"
      - "terraform/**"

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Terraform fmt
        run: terraform fmt -check -recursive terraform

      - name: Validate prod
        run: |
          terraform -chdir=terraform/envs/prod init -backend=false
          terraform -chdir=terraform/envs/prod validate

  run:
    name: Terraform ${{ inputs.action }} (prod)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: validate

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
      TF_VAR_AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_GITHUB_REPOSITORY: ${{ github.repository }}
      TF_VAR_TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
      TF_VAR_BOOTSTRAP_SECRET_ARN: ${{ vars.BOOTSTRAP_SECRET_ARN }}
      TF_VAR_DB_PASSWORD: ${{ secrets.TF_VAR_DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate workflow config
        run: |
          test -n "$AWS_REGION"
          test -n "$AWS_ROLE_ARN"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init prod
        run: |
          test -n "$TF_VAR_DOMAIN_NAME"
          test -n "$TF_VAR_BOOTSTRAP_SECRET_ARN"
          test -n "$TF_VAR_DB_PASSWORD"
          test -n "$TF_VAR_TF_STATE_BUCKET"

          terraform -chdir=terraform/envs/prod init \
            -backend-config="bucket=$TF_VAR_TF_STATE_BUCKET" \
            -backend-config="key=prod/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"

      - name: Terraform plan/apply/destroy
        run: |
          STACK_DIR="terraform/envs/prod"

          if [ "${{ inputs.action }}" = "destroy" ]; then
            test "${{ inputs.confirm_destroy }}" = "true"

            terraform -chdir="$STACK_DIR" destroy -auto-approve
          elif [ "${{ inputs.action }}" = "apply" ]; then
            terraform -chdir="$STACK_DIR" apply -auto-approve
          else
            terraform -chdir="$STACK_DIR" plan
          fi
